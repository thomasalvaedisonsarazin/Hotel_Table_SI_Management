# Every request reaches nginx through Caddy. Without this, all visitors would look like one
# client, and one person's failed logins would lock everyone out through the rate limit.
# Caddy replaces any X-Forwarded-For sent by a visitor, so this value can be trusted.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
